plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    /* Apache */
    api 'commons-codec:commons-codec:1.15'
	api 'commons-io:commons-io:2.11.0'

	/* Other */
	api 'net.dv8tion:JDA:5.0.0-beta.5'
	api 'com.google.code.gson:gson:2.8.8'
	api 'com.github.crykn:kryonet:2.22.8'
	api 'com.esotericsoftware:kryo:5.4.1-SNAPSHOT'
	
	/* Mail */
	api 'com.sun.mail:javax.mail:1.6.2'
	api 'com.sun.mail:smtp:1.6.2'
	implementation 'com.sun.mail:pop3:1.6.2'
	implementation 'com.sun.mail:imap:1.6.2'
	
	/* Shadow Apache */
    shadow 'commons-codec:commons-codec:1.15'
	shadow 'commons-io:commons-io:2.11.0'

	/* Shadow Other */
	shadow 'net.dv8tion:JDA:5.0.0-beta.5'
	shadow 'com.google.code.gson:gson:2.8.8'
	shadow 'com.github.crykn:kryonet:2.22.8'
	shadow 'com.esotericsoftware:kryo:5.4.1-SNAPSHOT'
	
	/* Shadow Mail */
	shadow 'com.sun.mail:javax.mail:1.6.2'
	shadow 'com.sun.mail:smtp:1.6.2'
	shadow 'com.sun.mail:pop3:1.6.2'
	shadow 'com.sun.mail:imap:1.6.2'

	/* Discord */
	implementation("net.dv8tion:JDA:5.0.0-beta.12")
    implementation 'ch.qos.logback:logback-classic:1.4.8'

	// sqlite jdbc
	implementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.42.0.0'

}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17

version = '1.0.0'
archivesBaseName = 'photon'

jar {
	duplicatesStrategy 'exclude'
   	manifest {
        attributes([ "Main-Class": "com.photon.network.NetworkEngine" ])
    }
}
shadowJar {
   	configurations = [project.configurations.shadow]
   	duplicatesStrategy 'exclude'
	archiveClassifier.set('')
}

tasks.build.dependsOn shadowJar