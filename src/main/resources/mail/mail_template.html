<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Photon Notification</title>
    <style type="text/css">
        /* Client-specific Resets */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; min-width: 100%; background-color: #000000; }

        /* Responsive Breakpoints */
        @media only screen and (max-width: 600px) {
            .email-container { width: 100% !important; }
            .fluid-padding { padding-left: 20px !important; padding-right: 20px !important; }
            .stack-column { display: block !important; width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <!-- Email Wrapper -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #000000; table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 40px 15px;">
                
                <!-- Main Card Container -->
                <table role="presentation" class="email-container" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);">
                    
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 32px 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background-color: #0d0d0d;">
                            <span style="font-size: 20px; font-weight: 700; color: #f0f0f0; letter-spacing: 0.5px; text-transform: uppercase;">
                                Photon <span style="color: #d8b4fe;">Control Panel</span>
                            </span>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td class="fluid-padding" style="padding: 40px 40px 30px 40px;">
                            <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #f0f0f0; line-height: 1.3;">
                                License Key Activated
                            </h1>
                            <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #a0a0a0;">
                                Hello Joe, your server license key has been generated successfully and linked to your account.
                            </p>

                            <!-- Highlight/Detail Panel -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #111111; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; margin-bottom: 28px;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                            <tr>
                                                <td style="padding-bottom: 8px; color: #a0a0a0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Product Target</td>
                                                <td align="right" style="padding-bottom: 8px; color: #f0f0f0; font-size: 14px; font-weight: 600;">Production Node</td>
                                            </tr>
                                            <tr>
                                                <td style="padding-bottom: 8px; color: #a0a0a0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Status</td>
                                                <td align="right" style="padding-bottom: 8px;">
                                                    <span style="display: inline-block; padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: 700; background-color: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3);">ACTIVE</span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="color: #a0a0a0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">License Key</td>
                                                <td align="right" style="color: #d8b4fe; font-family: Consolas, Monaco, monospace; font-size: 13px; font-weight: 600;">PHTN-98X2-KL49-01AZ</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- Call To Action (Button) -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <a href="#" target="_blank" style="display: inline-block; background-color: #d8b4fe; color: #000000; font-size: 14px; font-weight: 600; text-decoration: none; padding: 13px 32px; border-radius: 50px;">
                                            Go to Control Panel
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="fluid-padding" align="center" style="padding: 24px 40px 32px 40px; border-top: 1px solid rgba(255, 255, 255, 0.08); background-color: #050505;">
                            <p style="margin: 0 0 12px 0; font-size: 13px; color: #a0a0a0;">
                                <a href="#" style="color: #a0a0a0; text-decoration: none; margin: 0 8px;">Store</a> &bull; 
                                <a href="#" style="color: #a0a0a0; text-decoration: none; margin: 0 8px;">Terms</a> &bull; 
                                <a href="#" style="color: #a0a0a0; text-decoration: none; margin: 0 8px;">Privacy Policy</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
