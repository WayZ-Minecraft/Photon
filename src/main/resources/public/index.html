<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Photon Control Room</title>
        <link rel="stylesheet" href="./main.css">
        <script type="module" src="./js/main.js"></script>
    </head>
    <body>
        <div id="appShell"></div>

        <template id="appTemplate">
            <div class="page-shell">
                <div id="appChrome"></div>

                <main class="layout">
                    <section class="panel page page-active" data-page="overview">
                        <div class="hero panel-inner">
                            <div class="hero-copy">
                                <p class="eyebrow">Photon network console</p>
                                <h1>One place for status, config, and tables.</h1>
                                <p class="hero-text">
                                    Start with the navigation above. Public status stays visible to everyone, while project authors can sign in to manage the rest.
                                </p>
                            </div>
                            <div class="hero-stats" id="heroStats"></div>
                        </div>

                        <div class="button-row hero-actions">
                            <button type="button" class="primary" data-open-modal="auth">Sign in</button>
                            <button type="button" class="secondary" data-open-modal="createAccount">Create account</button>
                            <button type="button" class="secondary" data-go-page="status">View servers</button>
                            
                        </div>
                    </section>

                    <section class="panel page" data-page="status">
                        <div class="panel-header">
                            <div>
                                <p class="eyebrow">Public status</p>
                                <h2>Saved servers</h2>
                            </div>
                            <span class="status-pill neutral" id="serverCount">0 servers</span>
                        </div>
                        <div id="serverList" class="cards grid-list"></div>
                    </section>

                    

                    <section class="panel page" data-page="config">
                        <div class="panel-header">
                            <div>
                                <p class="eyebrow">Network config</p>
                                <h2>Edit runtime settings</h2>
                            </div>
                            <button type="button" class="primary" id="saveConfigButton">Save config</button>
                        </div>
                        <form id="configForm" class="config-grid"></form>
                    </section>

                    <section class="panel page" data-page="tables">
                        <div class="panel-header">
                            <div>
                                <p class="eyebrow">Tables</p>
                                <h2>Browse managed data</h2>
                            </div>
                            <div class="button-row compact">
                                <button type="button" class="secondary" id="refreshTableButton">Refresh</button>
                            </div>
                        </div>
                        <div class="table-toolbar">
                            <select id="tableSelect"></select>
                            <input type="number" id="tableLimit" min="1" max="500" value="100">
                        </div>
                        <div id="tableMeta" class="hint"></div>
                        <div class="table-wrap">
                            <table id="dataTable"></table>
                        </div>
                    </section>

                    <section class="panel page" data-page="operations">
                        <div class="panel-header">
                            <div>
                                <p class="eyebrow">Operations</p>
                                <h2>Restart the application</h2>
                                <p class="hint">Protected by project-author authentication.</p>
                            </div>
                            <button type="button" class="danger" id="restartButton">Restart Photon</button>
                        </div>
                    </section>
                </main>

                <footer id="appFooter"></footer>
            </div>
        </template>

        <div id="modalRoot"></div>
    </body>
</html>
